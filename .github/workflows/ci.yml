name: CI
on:
  push:
  pull_request:
  repository_dispatch:
    types: [guarded-source-update]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:index
      - run: pnpm build:public
      - run: pnpm test:run
      - run: pnpm build
