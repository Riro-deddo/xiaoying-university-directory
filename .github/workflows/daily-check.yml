name: Daily official-source check
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-official-source-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check registered official links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml src/data/sources.json
          fail: false
          jobSummary: true
      - name: Run guarded official-source synchronization
        run: pnpm sync:sources
      - run: pnpm build:index
      - run: pnpm test:run
      - run: pnpm build
      - name: Create or update one Issue per source anomaly
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          retries: 3
          script: |
            const { existsSync, readFileSync } = require('node:fs');
            const anomalyPath = `${process.env.GITHUB_WORKSPACE}/artifacts/source-anomalies.json`;
            if (!existsSync(anomalyPath)) return;

            const anomalies = JSON.parse(readFileSync(anomalyPath, 'utf8'));
            if (!Array.isArray(anomalies) || anomalies.length === 0) return;

            const rendererPath = `${process.env.GITHUB_WORKSPACE}/scripts/render-anomaly-issue.mjs`;
            const { anomalyIssuePayload } = await import(rendererPath);
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const anomaly of anomalies) {
              const payload = anomalyIssuePayload(anomaly);
              const marker = `<!-- ${payload.key} -->`;
              const existing = openIssues.find((issue) => !issue.pull_request && issue.body?.includes(marker));
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: payload.title,
                  body: payload.body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: payload.title,
                  body: payload.body,
                });
              }
            }
      - name: Commit accepted machine data only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/status.json src/data/institutions.json src/data/generated/requirements.json src/data/generated/reverse-index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/status.json src/data/institutions.json src/data/generated/requirements.json src/data/generated/reverse-index.json
          git commit -m "chore: refresh guarded official-source data"
          git push
          COMMITTED_SHA=$(git rev-parse HEAD)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=guarded-source-update -f "client_payload[sha]=$COMMITTED_SHA"
