version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/London
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      non-major:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
      timezone: Europe/London
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      non-major:
        update-types: [minor, patch]
